<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>✨ Caitlin's Drawing Game ✨</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #12122a; }
    #root { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    .canvas-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .canvas-area canvas {
      position: absolute;
      top: 0; left: 0;
      display: block;
    }

    /* ── toolbar ─────────────────────────────────── */
    .toolbar {
      background: #12122a;
      border-top: 2px solid #3a3a8a;
      padding: 5px 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }
    .trow {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .trow::-webkit-scrollbar { display: none; }

    .btn {
      background: #2a2a6a;
      color: #fff;
      border: 2px solid #4a4aaa;
      border-radius: 20px;
      padding: 5px 11px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background .1s, border-color .1s;
      font-family: inherit;
    }
    .btn:hover  { background: #3a3a9a; }
    .btn.active { background: #6644cc; border-color: #aa88ff; }
    .btn.magic  {
      background: linear-gradient(90deg,#ff6ec7,#ffcd3c,#6ec7ff,#ff6ec7);
      background-size: 200%;
      border: none;
      animation: shimmer 2s linear infinite;
      color: #fff;
      font-weight: bold;
    }
    @keyframes shimmer { to { background-position: 200% center; } }

    .sep { width: 1px; height: 26px; background: #3a3a8a; flex-shrink: 0; }

    .color-dot {
      width: 26px; height: 26px;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      border: 3px solid transparent;
      transition: transform .1s, border-color .1s;
    }
    .color-dot.active { border-color: #fff; transform: scale(1.3); }

    input[type="range"] {
      flex-shrink: 0;
      width: 80px;
      accent-color: #aa88ff;
      cursor: pointer;
    }

    /* ── floating panels ─────────────────────────── */
    .panel {
      position: fixed;
      left: 0; right: 0;
      background: #12122a;
      border-top: 2px solid #3a3a8a;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 175px;
      overflow-y: auto;
      z-index: 100;
    }
    .stamp-btn {
      font-size: 30px;
      background: none;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 2px;
      cursor: pointer;
      line-height: 1;
      transition: border-color .1s, background .1s;
    }
    .stamp-btn:hover, .stamp-btn.active { border-color: #aa88ff; background: #2a2a6a; }

    .animal-btn {
      background: #2a2a6a;
      color: #fff;
      border: 2px solid #4a4aaa;
      border-radius: 12px;
      padding: 7px 13px;
      font-size: 14px;
      cursor: pointer;
      transition: background .1s, border-color .1s;
      font-family: inherit;
    }
    .animal-btn:hover  { background: #3a3a9a; }
    .animal-btn.active { background: #6644cc; border-color: #aa88ff; }

    /* ── celebration overlay ─────────────────────── */
    .celebration {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #ff6ec7 0%, #ff9d6f 50%, #ffcd3c 100%);
      color: #fff;
      padding: 28px 38px;
      border-radius: 22px;
      font-size: 20px;
      text-align: center;
      z-index: 1000;
      box-shadow: 0 0 50px rgba(255,110,200,.85);
      font-weight: bold;
      line-height: 1.9;
      pointer-events: none;
      animation: pop .3s ease-out;
    }
    @keyframes pop {
      from { transform: translate(-50%,-50%) scale(.4); opacity: 0; }
      to   { transform: translate(-50%,-50%) scale(1);  opacity: 1; }
    }

    /* current stamp cursor hint */
    .stamp-hint {
      position: fixed;
      top: 8px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.6);
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
      z-index: 200;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script>
const { h, render, useState, useRef, useEffect, htm, getStroke } = CaitlinLibs;
const html = htm.bind(h);

/* ════════════════════════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════════════════════════ */

const COLORS = [
  // neutrals
  '#000000','#333333','#666666','#999999','#cccccc','#ffffff',
  // warm spectrum
  '#ff0000','#ff4400','#ff8800','#ffcc00','#ffff00','#aaff00',
  // cool spectrum
  '#00cc00','#00ff88','#00ffff','#0088ff','#0000ff','#4400ff',
  // purples
  '#8800ff','#cc00ff','#ff00ff','#dd44ff','#bb00cc','#7700aa',
  // pinks (lots!)
  '#ff0099','#ff3399','#ff44aa','#ff66bb','#ff88cc','#ffaadd',
  '#ff66dd','#ff00cc','#cc0077','#ff77ee','#ffbbee','#ffddee',
  // warm extras
  '#ff9966','#ffcc88','#FFD700','#8B4513','#D2691E','#FFDAB9',
];

const TOOLS = { PENCIL:'pencil', SPARKLE:'sparkle', RAINBOW:'rainbow', ERASER:'eraser' };

const TOOL_ICONS = { pencil:'✏️', sparkle:'✨', rainbow:'🌈', eraser:'🩹' };

const STAMPS = [
  '❤️','⭐','🌟','✨','💫','🦄','🦋','🌸','🌈',
  '🍭','🎀','🌺','🐱','🐶','🐰','🦊','🌻','💎',
  '🍦','🎠','🎈','🎉','🌙','☀️','🌊',
];

const ANIMALS = [
  { id:'cat',       name:'🐱 Cat'       },
  { id:'dog',       name:'🐶 Dog'       },
  { id:'butterfly', name:'🦋 Butterfly' },
  { id:'fish',      name:'🐟 Fish'      },
  { id:'unicorn',   name:'🦄 Unicorn'   },
  { id:'bunny',     name:'🐰 Bunny'     },
  { id:'bear',      name:'🐻 Bear'      },
];

/* ════════════════════════════════════════════════════════════
   ANIMAL TEMPLATE DRAWING (canvas 2D path art)
════════════════════════════════════════════════════════════ */

function drawAnimalTemplate(ctx, animal, w, h) {
  ctx.save();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const fn = { cat:drawCat, dog:drawDog, butterfly:drawButterfly,
               fish:drawFish, unicorn:drawUnicorn, bunny:drawBunny, bear:drawBear }[animal];
  if (fn) fn(ctx, w, h);
  ctx.restore();
}

function wfill(ctx) { ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); }

function drawCat(ctx, w, h) {
  const cx = w/2, cy = h*.42, r = Math.min(w,h)*.29;
  // head
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); wfill(ctx);
  // ears
  [[cx-r*.7,cy-r*.7, cx-r*.55,cy-r*1.18, cx-r*.1,cy-r*.82],
   [cx+r*.7,cy-r*.7, cx+r*.55,cy-r*1.18, cx+r*.1,cy-r*.82]].forEach(([ax,ay,bx,by,cx2,cy2])=>{
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.lineTo(cx2,cy2);
    ctx.closePath(); wfill(ctx);
  });
  // eyes
  [cx-r*.35, cx+r*.35].forEach(ex=>{
    ctx.beginPath(); ctx.arc(ex,cy-r*.18,r*.13,0,Math.PI*2); ctx.stroke();
  });
  // nose
  ctx.beginPath(); ctx.moveTo(cx,cy+r*.1); ctx.lineTo(cx-r*.1,cy+r*.22); ctx.lineTo(cx+r*.1,cy+r*.22); ctx.closePath(); ctx.stroke();
  // whiskers
  [[cx-r*.1,cy+r*.13,cx-r*.92,cy+r*.02],[cx-r*.1,cy+r*.2,cx-r*.92,cy+r*.26],
   [cx+r*.1,cy+r*.13,cx+r*.92,cy+r*.02],[cx+r*.1,cy+r*.2,cx+r*.92,cy+r*.26]].forEach(([x1,y1,x2,y2])=>{
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
  // mouth
  ctx.beginPath();
  ctx.moveTo(cx,cy+r*.22); ctx.quadraticCurveTo(cx-r*.2,cy+r*.4,cx-r*.36,cy+r*.36);
  ctx.moveTo(cx,cy+r*.22); ctx.quadraticCurveTo(cx+r*.2,cy+r*.4,cx+r*.36,cy+r*.36);
  ctx.stroke();
  // body
  ctx.beginPath(); ctx.ellipse(cx,cy+r*1.52,r*.62,r*.82,0,0,Math.PI*2); wfill(ctx);
  // tail
  ctx.beginPath(); ctx.moveTo(cx+r*.58,cy+r*2.12);
  ctx.quadraticCurveTo(cx+r*1.5,cy+r*2.5,cx+r*1.2,cy+r*1.5); ctx.stroke();
  // paws
  [cx-r*.35, cx+r*.35].forEach(px=>{
    ctx.beginPath(); ctx.ellipse(px,cy+r*2.42,r*.24,r*.14,0,0,Math.PI*2); wfill(ctx);
  });
}

function drawDog(ctx, w, h) {
  const cx = w/2, cy = h*.4, r = Math.min(w,h)*.27;
  // floppy ears
  [[cx-r*.8,cy-r*.5, cx-r*1.3,cy+r*.2, cx-r*.9,cy+r*.7, cx-r*.6,cy+r*.3, cx-r*.6,cy-r*.3],
   [cx+r*.8,cy-r*.5, cx+r*1.3,cy+r*.2, cx+r*.9,cy+r*.7, cx+r*.6,cy+r*.3, cx+r*.6,cy-r*.3]
  ].forEach(([ax,ay,bx,by,cx2,cy2,dx,dy,ex,ey])=>{
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(bx,by,cx2,cy2);
    ctx.quadraticCurveTo(dx,dy,ex,ey); ctx.closePath(); wfill(ctx);
  });
  // head
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); wfill(ctx);
  // eyes
  [cx-r*.35,cx+r*.35].forEach(ex=>{
    ctx.beginPath(); ctx.arc(ex,cy-r*.12,r*.13,0,Math.PI*2); ctx.stroke();
  });
  // snout
  ctx.beginPath(); ctx.ellipse(cx,cy+r*.36,r*.44,r*.3,0,0,Math.PI*2); wfill(ctx);
  // nose
  ctx.beginPath(); ctx.ellipse(cx,cy+r*.22,r*.19,r*.13,0,0,Math.PI*2); ctx.stroke();
  // mouth
  ctx.beginPath();
  ctx.moveTo(cx,cy+r*.36); ctx.quadraticCurveTo(cx-r*.25,cy+r*.54,cx-r*.4,cy+r*.5);
  ctx.moveTo(cx,cy+r*.36); ctx.quadraticCurveTo(cx+r*.25,cy+r*.54,cx+r*.4,cy+r*.5);
  ctx.stroke();
  // body
  ctx.beginPath(); ctx.ellipse(cx,cy+r*1.62,r*.68,r*.88,0,0,Math.PI*2); wfill(ctx);
  // tail
  ctx.beginPath(); ctx.moveTo(cx+r*.63,cy+r*1.1);
  ctx.quadraticCurveTo(cx+r*1.58,cy+r*.62,cx+r*1.38,cy+r*.22); ctx.stroke();
  // legs
  [cx-r*.42,cx+r*.42].forEach(lx=>{
    ctx.beginPath(); ctx.moveTo(lx,cy+r*2.4); ctx.lineTo(lx,cy+r*3.05);
    ctx.lineTo(lx+(lx>cx?r*.2:-r*.2),cy+r*3.05); ctx.stroke();
  });
}

function drawButterfly(ctx, w, h) {
  const cx = w/2, cy = h/2, r = Math.min(w,h)*.34;
  // wings (left top, right top, left bottom, right bottom)
  const wings = [
    ()=>{ ctx.moveTo(cx,cy-r*.18); ctx.quadraticCurveTo(cx-r*.8,cy-r*1.28,cx-r*1.1,cy-r*.1); ctx.quadraticCurveTo(cx-r*.9,cy+r*.32,cx,cy+r*.1); },
    ()=>{ ctx.moveTo(cx,cy-r*.18); ctx.quadraticCurveTo(cx+r*.8,cy-r*1.28,cx+r*1.1,cy-r*.1); ctx.quadraticCurveTo(cx+r*.9,cy+r*.32,cx,cy+r*.1); },
    ()=>{ ctx.moveTo(cx,cy+r*.1); ctx.quadraticCurveTo(cx-r*.7,cy+r*.82,cx-r*.82,cy+r*1.1); ctx.quadraticCurveTo(cx-r*.5,cy+r*1.32,cx,cy+r*.78); },
    ()=>{ ctx.moveTo(cx,cy+r*.1); ctx.quadraticCurveTo(cx+r*.7,cy+r*.82,cx+r*.82,cy+r*1.1); ctx.quadraticCurveTo(cx+r*.5,cy+r*1.32,cx,cy+r*.78); },
  ];
  wings.forEach(fn=>{ ctx.beginPath(); fn(); ctx.closePath(); wfill(ctx); });
  // wing spots
  [[cx-r*.5,cy-r*.38],[cx+r*.5,cy-r*.38],[cx-r*.38,cy+r*.52],[cx+r*.38,cy+r*.52]].forEach(([sx,sy])=>{
    ctx.beginPath(); ctx.arc(sx,sy,r*.14,0,Math.PI*2); ctx.stroke();
  });
  // body
  ctx.beginPath(); ctx.ellipse(cx,cy+r*.32,r*.08,r*.52,0,0,Math.PI*2); ctx.stroke();
  // antennae
  [[-1,1],[1,-1]].forEach(([dx,bend])=>{
    const ex = cx+dx*r*.3, ey = cy-r*1.1;
    ctx.beginPath(); ctx.moveTo(cx+dx*r*.05,cy-r*.15); ctx.quadraticCurveTo(cx+bend*r*.3,cy-r*.8,ex,ey); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex,ey,r*.065,0,Math.PI*2); ctx.stroke();
  });
}

function drawFish(ctx, w, h) {
  const cx = w/2, cy = h/2, r = Math.min(w,h)*.3;
  // body
  ctx.beginPath(); ctx.ellipse(cx,cy,r*1.18,r*.68,0,0,Math.PI*2); wfill(ctx);
  // tail
  ctx.beginPath(); ctx.moveTo(cx+r*1.1,cy); ctx.lineTo(cx+r*1.82,cy-r*.68); ctx.lineTo(cx+r*1.82,cy+r*.68); ctx.closePath(); wfill(ctx);
  // top fin
  ctx.beginPath(); ctx.moveTo(cx-r*.3,cy-r*.65); ctx.quadraticCurveTo(cx,cy-r*1.28,cx+r*.42,cy-r*.65); ctx.stroke();
  // scales
  [cx-r*.08, cx+r*.32].forEach(sx=>{
    ctx.beginPath(); ctx.arc(sx,cy,r*.38,-Math.PI*.5,Math.PI*.5); ctx.stroke();
  });
  // eye
  ctx.beginPath(); ctx.arc(cx-r*.62,cy-r*.1,r*.15,0,Math.PI*2); ctx.stroke();
  // mouth
  ctx.beginPath(); ctx.arc(cx-r*1.0,cy+r*.1,r*.1,-Math.PI*.32,Math.PI*.32); ctx.stroke();
}

function drawUnicorn(ctx, w, h) {
  const cx = w/2, cy = h*.42, r = Math.min(w,h)*.27;
  // head
  ctx.beginPath(); ctx.arc(cx,cy,r*.84,0,Math.PI*2); wfill(ctx);
  // horn
  ctx.beginPath(); ctx.moveTo(cx-r*.11,cy-r*.8); ctx.lineTo(cx,cy-r*1.62); ctx.lineTo(cx+r*.11,cy-r*.8); ctx.closePath(); wfill(ctx);
  // horn spiral lines
  for (let i=0;i<3;i++) {
    const hy = cy-r*(.9+i*.26);
    ctx.beginPath(); ctx.moveTo(cx-r*.09,hy); ctx.lineTo(cx+r*.09,hy-r*.05); ctx.stroke();
  }
  // ear
  ctx.beginPath(); ctx.moveTo(cx-r*.6,cy-r*.62); ctx.lineTo(cx-r*.5,cy-r*1.06); ctx.lineTo(cx-r*.15,cy-r*.72); ctx.closePath(); wfill(ctx);
  // mane strands
  [[cx+r*.68,cy-r*.62, cx+r*1.1,cy-r*.2, cx+r*.88,cy+r*.22],
   [cx+r*.5, cy-r*.72, cx+r*.9,cy-r*.32, cx+r*.68,cy+r*.12],
  ].forEach(([ax,ay,bx,by,cx2,cy2])=>{
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(bx,by,cx2,cy2); ctx.stroke();
  });
  // eye + lash
  ctx.beginPath(); ctx.arc(cx-r*.24,cy-r*.05,r*.14,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-r*.34,cy-r*.15); ctx.lineTo(cx-r*.44,cy-r*.28); ctx.stroke();
  // nostril
  ctx.beginPath(); ctx.ellipse(cx+r*.3,cy+r*.35,r*.08,r*.05,Math.PI*.3,0,Math.PI*2); ctx.stroke();
  // body
  ctx.beginPath(); ctx.ellipse(cx-r*.1,cy+r*1.58,r*.74,r*.93,Math.PI*.04,0,Math.PI*2); wfill(ctx);
  // legs
  [[cx-r*.5,cy+r*2.44],[cx-r*.15,cy+r*2.5],[cx+r*.2,cy+r*2.5],[cx+r*.55,cy+r*2.44]].forEach(([lx,ly])=>{
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx,ly+r*.58); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(lx,ly+r*.62,r*.12,r*.07,0,0,Math.PI*2); ctx.stroke();
  });
  // tail
  ctx.beginPath(); ctx.moveTo(cx+r*.58,cy+r*1.18);
  ctx.quadraticCurveTo(cx+r*1.5,cy+r*1.5,cx+r*1.28,cy+r*2.28);
  ctx.quadraticCurveTo(cx+r*1.58,cy+r*2.58,cx+r*1.2,cy+r*2.8); ctx.stroke();
}

function drawBunny(ctx, w, h) {
  const cx = w/2, cy = h*.5, r = Math.min(w,h)*.27;
  // ears (outer + inner)
  [cx-r*.3, cx+r*.3].forEach((ex,i)=>{
    const angle = (i===0?-1:1)*Math.PI*.1;
    ctx.beginPath(); ctx.ellipse(ex,cy-r*1.3,r*.18,r*.54,angle,0,Math.PI*2); wfill(ctx);
    ctx.beginPath(); ctx.ellipse(ex,cy-r*1.3,r*.09,r*.36,angle,0,Math.PI*2); ctx.stroke();
  });
  // head
  ctx.beginPath(); ctx.arc(cx,cy-r*.2,r*.8,0,Math.PI*2); wfill(ctx);
  // eyes
  [cx-r*.3,cx+r*.3].forEach(ex=>{
    ctx.beginPath(); ctx.arc(ex,cy-r*.36,r*.13,0,Math.PI*2); ctx.stroke();
  });
  // nose
  ctx.beginPath(); ctx.ellipse(cx,cy+r*.04,r*.08,r*.06,0,0,Math.PI*2); ctx.stroke();
  // mouth
  ctx.beginPath();
  ctx.moveTo(cx,cy+r*.1); ctx.quadraticCurveTo(cx-r*.16,cy+r*.24,cx-r*.28,cy+r*.2);
  ctx.moveTo(cx,cy+r*.1); ctx.quadraticCurveTo(cx+r*.16,cy+r*.24,cx+r*.28,cy+r*.2);
  ctx.stroke();
  // whiskers
  [[cx-r*.1,cy+r*.04,cx-r*.78,cy-r*.06],[cx+r*.1,cy+r*.04,cx+r*.78,cy-r*.06]].forEach(([x1,y1,x2,y2])=>{
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });
  // body
  ctx.beginPath(); ctx.ellipse(cx,cy+r*1.2,r*.63,r*.83,0,0,Math.PI*2); wfill(ctx);
  // fluffy tail
  ctx.beginPath(); ctx.arc(cx+r*.62,cy+r*1.82,r*.22,0,Math.PI*2); wfill(ctx);
  // front paws
  [[cx-r*.32,cy+r*2.1],[cx+r*.12,cy+r*2.15]].forEach(([px,py])=>{
    ctx.beginPath(); ctx.ellipse(px,py,r*.2,r*.13,0,0,Math.PI*2); wfill(ctx);
  });
}

function drawBear(ctx, w, h) {
  const cx = w/2, cy = h*.42, r = Math.min(w,h)*.28;
  // ears
  [cx-r*.7,cx+r*.7].forEach(ex=>{
    ctx.beginPath(); ctx.arc(ex,cy-r*.75,r*.27,0,Math.PI*2); wfill(ctx);
    ctx.beginPath(); ctx.arc(ex,cy-r*.75,r*.15,0,Math.PI*2); ctx.stroke();
  });
  // head
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); wfill(ctx);
  // muzzle
  ctx.beginPath(); ctx.ellipse(cx,cy+r*.36,r*.44,r*.3,0,0,Math.PI*2); wfill(ctx);
  // nose
  ctx.beginPath(); ctx.ellipse(cx,cy+r*.22,r*.15,r*.1,0,0,Math.PI*2); ctx.stroke();
  // eyes
  [cx-r*.35,cx+r*.35].forEach(ex=>{
    ctx.beginPath(); ctx.arc(ex,cy-r*.12,r*.12,0,Math.PI*2); ctx.stroke();
  });
  // mouth
  ctx.beginPath();
  ctx.moveTo(cx,cy+r*.3); ctx.quadraticCurveTo(cx-r*.2,cy+r*.5,cx-r*.36,cy+r*.46);
  ctx.moveTo(cx,cy+r*.3); ctx.quadraticCurveTo(cx+r*.2,cy+r*.5,cx+r*.36,cy+r*.46);
  ctx.stroke();
  // body
  ctx.beginPath(); ctx.ellipse(cx,cy+r*1.65,r*.74,r*.93,0,0,Math.PI*2); wfill(ctx);
  // tummy
  ctx.beginPath(); ctx.ellipse(cx,cy+r*1.68,r*.44,r*.54,0,0,Math.PI*2); ctx.stroke();
  // arms
  [[cx-r*.94,cy+r*1.28,Math.PI*.2],[cx+r*.94,cy+r*1.28,-Math.PI*.2]].forEach(([ax,ay,angle])=>{
    ctx.beginPath(); ctx.ellipse(ax,ay,r*.22,r*.5,angle,0,Math.PI*2); wfill(ctx);
  });
  // legs
  [cx-r*.42,cx+r*.42].forEach(lx=>{
    ctx.beginPath(); ctx.ellipse(lx,cy+r*2.5,r*.25,r*.38,0,0,Math.PI*2); wfill(ctx);
  });
}

/* ════════════════════════════════════════════════════════════
   STROKE RENDERING
════════════════════════════════════════════════════════════ */

function renderLine(ctx, line) {
  if (!line) return;

  if (line.type === 'stroke') {
    if (!line.points || line.points.length === 0) return;
    const pts = line.points.map(p => [p.x, p.y, p.pressure ?? 0.5]);
    const stroke = getStroke(pts, { size: line.size, thinning: 0.5, smoothing: 0.5, streamline: 0.4 });
    if (!stroke.length) return;
    ctx.save();
    if (line.eraser) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.fillStyle = line.color;
    }
    ctx.beginPath();
    ctx.moveTo(stroke[0][0], stroke[0][1]);
    for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i][0], stroke[i][1]);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

  } else if (line.type === 'rainbow') {
    if (!line.segments) return;
    ctx.save();
    ctx.lineWidth = line.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const seg of line.segments) {
      if (!seg.points || seg.points.length < 2) continue;
      ctx.strokeStyle = seg.color;
      ctx.beginPath();
      ctx.moveTo(seg.points[0].x, seg.points[0].y);
      for (let i = 1; i < seg.points.length; i++) ctx.lineTo(seg.points[i].x, seg.points[i].y);
      ctx.stroke();
    }
    ctx.restore();

  } else if (line.type === 'sparkle') {
    if (!line.stars) return;
    for (const s of line.stars) {
      ctx.save();
      ctx.fillStyle = s.color;
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rotation);
      ctx.beginPath();
      // 4-pointed star
      for (let i = 0; i < 8; i++) {
        const angle = (i * Math.PI) / 4 - Math.PI / 4;
        const rad = i % 2 === 0 ? s.r : s.r * 0.35;
        i === 0 ? ctx.moveTo(Math.cos(angle)*rad, Math.sin(angle)*rad)
                : ctx.lineTo(Math.cos(angle)*rad, Math.sin(angle)*rad);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

  } else if (line.type === 'stamp') {
    ctx.save();
    ctx.font = `${line.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(line.emoji, line.x, line.y);
    ctx.restore();
  }
}

/* ════════════════════════════════════════════════════════════
   APP COMPONENT
════════════════════════════════════════════════════════════ */

function App() {
  const containerRef  = useRef(null);
  const bgCanvasRef   = useRef(null);
  const drawCanvasRef = useRef(null);
  const toolbarRef    = useRef(null);
  const rainbowHueRef = useRef(0);

  const [lines,       setLines]       = useState([]);
  const [currentLine, setCurrentLine] = useState(null);
  const [tool,        setTool]        = useState(TOOLS.PENCIL);
  const [color,       setColor]       = useState('#ff0088');
  const [size,        setSize]        = useState(8);
  const [template,    setTemplate]    = useState(null);
  const [stampEmoji,  setStampEmoji]  = useState(null);
  const [panel,       setPanel]       = useState(null);  // 'stamps'|'animals'|null
  const [celebration, setCelebration] = useState(false);
  // track canvas size so effects re-run on resize
  const [canvasSize,  setCanvasSize]  = useState({ w: 300, h: 300 });

  /* ── resize: keep canvases matched to container ── */
  useEffect(() => {
    const container = containerRef.current;
    if (!container) return;
    const obs = new ResizeObserver(entries => {
      for (const entry of entries) {
        const w = Math.round(entry.contentRect.width);
        const h = Math.round(entry.contentRect.height);
        if (bgCanvasRef.current)   { bgCanvasRef.current.width   = w; bgCanvasRef.current.height   = h; }
        if (drawCanvasRef.current) { drawCanvasRef.current.width = w; drawCanvasRef.current.height = h; }
        setCanvasSize({ w, h });
      }
    });
    obs.observe(container);
    return () => obs.disconnect();
  }, []);

  /* ── background canvas: white fill + animal template ── */
  useEffect(() => {
    const canvas = bgCanvasRef.current;
    if (!canvas || canvas.width === 0) return;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (template) drawAnimalTemplate(ctx, template, canvas.width, canvas.height);
  }, [template, canvasSize]);

  /* ── draw canvas: all stored + in-progress strokes ── */
  useEffect(() => {
    const canvas = drawCanvasRef.current;
    if (!canvas || canvas.width === 0) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const line of lines) renderLine(ctx, line);
    if (currentLine) renderLine(ctx, currentLine);
  }, [lines, currentLine, canvasSize]);

  /* ── pointer handlers ── */
  function onPointerDown(e) {
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_) { /* fine: synthetic events in tests have no active pointer */ }
    const { offsetX: x, offsetY: y, pressure } = e;
    const p = pressure || 0.5;

    if (stampEmoji) {
      setLines(prev => [...prev, { type:'stamp', emoji:stampEmoji, x, y, size:50 }]);
      return;
    }

    if (tool === TOOLS.SPARKLE) {
      setCurrentLine({ type:'sparkle', stars: makeStars(x, y, color, size) });
    } else if (tool === TOOLS.RAINBOW) {
      const hsl = nextRainbow();
      setCurrentLine({ type:'rainbow', size, segments:[{ points:[{x,y,pressure:p}], color:hsl }] });
    } else {
      setCurrentLine({
        type:'stroke',
        points: [{ x, y, pressure:p }],
        color: tool === TOOLS.ERASER ? '#000' : color,
        size:  tool === TOOLS.ERASER ? size*3 : size,
        eraser: tool === TOOLS.ERASER,
      });
    }
  }

  function onPointerMove(e) {
    if (e.buttons !== 1) return;
    e.preventDefault();
    if (stampEmoji) return;
    const { offsetX: x, offsetY: y, pressure } = e;
    const p = pressure || 0.5;
    // All branching uses `prev` (current state) to avoid stale-closure bugs
    // when the tool changes between render cycles.
    setCurrentLine(prev => {
      if (!prev) return prev;
      if (prev.type === 'sparkle') {
        const newStars = makeStars(x, y, color, size);
        return { ...prev, stars: [...prev.stars, ...newStars] };
      } else if (prev.type === 'rainbow') {
        const hsl = nextRainbow();
        const segs = prev.segments;
        const lastPt = segs[segs.length-1].points.at(-1);
        return { ...prev, segments: [...segs, { points:[lastPt,{x,y,pressure:p}], color:hsl }] };
      } else {
        return { ...prev, points: [...prev.points, { x, y, pressure:p }] };
      }
    });
  }

  function onPointerUp() {
    // Use functional form so we always read the live `currentLine` value,
    // not the stale closure copy captured at last render.
    setCurrentLine(prev => {
      if (prev) setLines(l => [...l, prev]);
      return null;
    });
  }

  function nextRainbow() {
    const hsl = `hsl(${rainbowHueRef.current},100%,55%)`;
    rainbowHueRef.current = (rainbowHueRef.current + 4) % 360;
    return hsl;
  }

  function makeStars(x, y, col, sz) {
    const count = 3 + Math.floor(Math.random() * 3);
    return Array.from({ length: count }, () => ({
      x: x + (Math.random()-.5) * sz * 4,
      y: y + (Math.random()-.5) * sz * 4,
      r: sz * 0.25 + Math.random() * sz * 0.5,
      color: col,
      rotation: Math.random() * Math.PI,
    }));
  }

  /* ── toolbar actions ── */
  function undo()  { setLines(prev => prev.slice(0,-1)); }
  function clear() { setLines([]); setCurrentLine(null); }

  function save() {
    const bg   = bgCanvasRef.current;
    const draw = drawCanvasRef.current;
    const tmp  = document.createElement('canvas');
    tmp.width  = bg.width;
    tmp.height = bg.height;
    const ctx  = tmp.getContext('2d');
    ctx.drawImage(bg,   0, 0);
    ctx.drawImage(draw, 0, 0);
    tmp.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a   = document.createElement('a');
      a.href     = url;
      a.download = 'my-drawing.png';
      a.click();
      URL.revokeObjectURL(url);
    });
  }

  function unlockAll() {
    setCelebration(true);
    setTimeout(() => setCelebration(false), 3500);
  }

  function selectTool(t) { setTool(t); setStampEmoji(null); setPanel(null); }

  function pickColor(c) {
    setColor(c);
    if (tool === TOOLS.ERASER) setTool(TOOLS.PENCIL);
    setStampEmoji(null);
  }

  function togglePanel(name) {
    setPanel(prev => prev === name ? null : name);
  }

  function selectTemplate(id) {
    setTemplate(prev => prev === id ? null : id);
    setPanel(null);
    clear();
  }

  /* ── panel bottom offset (above toolbar) ── */
  const panelStyle = toolbarRef.current
    ? { bottom: toolbarRef.current.offsetHeight }
    : { bottom: 105 };

  /* ── render ── */
  return html`
    <div id="root">

      <!-- canvas area -->
      <div class="canvas-area" ref=${containerRef}>
        <canvas ref=${bgCanvasRef} style=${{ pointerEvents:'none' }} />
        <canvas
          ref=${drawCanvasRef}
          style=${{ touchAction:'none', cursor: stampEmoji ? 'cell' : 'crosshair' }}
          onPointerDown=${onPointerDown}
          onPointerMove=${onPointerMove}
          onPointerUp=${onPointerUp}
          onPointerCancel=${onPointerUp}
        />
      </div>

      <!-- toolbar -->
      <div class="toolbar" ref=${toolbarRef}>

        <!-- row 1: tools + actions -->
        <div class="trow">
          ${Object.values(TOOLS).map(t => html`
            <button key=${t} class=${'btn'+(tool===t&&!stampEmoji?' active':'')}
              onClick=${()=>selectTool(t)}>
              ${TOOL_ICONS[t]}
            </button>
          `)}
          <div class="sep"/>
          <button class="btn" onClick=${undo}>↩️ Undo</button>
          <button class="btn" onClick=${clear}>🗑️ Clear</button>
          <button class="btn" onClick=${save}>💾 Save</button>
          <div class="sep"/>
          <button class=${'btn'+(panel==='stamps'?' active':'')} onClick=${()=>togglePanel('stamps')}>🎀 Stamps</button>
          <button class=${'btn'+(panel==='animals'?' active':'')} onClick=${()=>togglePanel('animals')}>🐾 Animals</button>
          <button class="btn magic" onClick=${unlockAll}>🔓 Unlock All!</button>
        </div>

        <!-- row 2: colour palette + size -->
        <div class="trow">
          ${COLORS.map(c => html`
            <div key=${c} class=${'color-dot'+(color===c&&tool!==TOOLS.ERASER?' active':'')}
              style=${{ background:c, boxShadow: c==='#ffffff'?'inset 0 0 0 1px #999':'none' }}
              onClick=${()=>pickColor(c)} />
          `)}
          <div class="sep"/>
          <span style=${{ color:'#ccc', fontSize:'12px', flexShrink:0 }}>Size</span>
          <input type="range" min="2" max="50" value=${size}
            onInput=${e=>setSize(Number(e.target.value))} />
          <span style=${{ color:'#aaa', fontSize:'12px', flexShrink:0, minWidth:'20px' }}>${size}</span>
        </div>

      </div>

      <!-- stamps panel -->
      ${panel === 'stamps' && html`
        <div class="panel" style=${panelStyle}>
          <button class=${'stamp-btn'+(!stampEmoji?' active':'')} onClick=${()=>setStampEmoji(null)}>✏️</button>
          ${STAMPS.map(s => html`
            <button key=${s} class=${'stamp-btn'+(stampEmoji===s?' active':'')}
              onClick=${()=>{ setStampEmoji(s); }}>
              ${s}
            </button>
          `)}
        </div>
      `}

      <!-- animals panel -->
      ${panel === 'animals' && html`
        <div class="panel" style=${panelStyle}>
          <button class=${'animal-btn'+(!template?' active':'')}
            onClick=${()=>selectTemplate(null)}>🎨 Blank</button>
          ${ANIMALS.map(a => html`
            <button key=${a.id} class=${'animal-btn'+(template===a.id?' active':'')}
              onClick=${()=>selectTemplate(a.id)}>
              ${a.name}
            </button>
          `)}
        </div>
      `}

      <!-- stamp mode hint -->
      ${stampEmoji && html`
        <div class="stamp-hint">Tap to place ${stampEmoji} — tap ✏️ in Stamps to draw</div>
      `}

      <!-- celebration -->
      ${celebration && html`
        <div class="celebration">
          🎉 ✨ 🦄 ✨ 🎉<br/>
          Congratulations!<br/>
          You unlocked ALL the animals!<br/>
          🐱 🐶 🦋 🐟 🦄 🐰 🐻
        </div>
      `}

    </div>
  `;
}

render(html`<${App} />`, document.body);
</script>
</body>
</html>
